[package]
name = "blade-graphics"
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
description = "Graphics abstraction for Blade"
keywords = ["graphics"]
license = "MIT"
repository = "https://github.com/kvark/blade"

[lib]

[[example]]
name = "d3d12-probe"
required-features = ["d3d12"]

[[example]]
name = "d3d12-smoke"
required-features = ["d3d12"]

[[example]]
name = "d3d12-compile"
required-features = ["d3d12"]

[[example]]
name = "d3d12-compute"
required-features = ["d3d12"]

[[example]]
name = "d3d12-render"
required-features = ["d3d12"]

[[example]]
name = "d3d12-swapchain"
required-features = ["d3d12"]

[[example]]
name = "d3d12-mesh"
required-features = ["d3d12"]

[[example]]
name = "d3d12-texture"
required-features = ["d3d12"]

[[example]]
name = "d3d12-wgsl"
required-features = ["d3d12"]

[[example]]
name = "d3d12-raytracing"
required-features = ["d3d12"]

[[example]]
name = "d3d12-window"
required-features = ["d3d12"]

[features]
# Direct3D 12 backend (Windows only). The device layer initializes the device,
# creates buffers and submits copies; see `etc/d3d12.md` for the design and the
# phased plan.
d3d12 = ["dep:windows"]

[dependencies]
bitflags = { workspace = true }
bytemuck = { workspace = true }
codespan-reporting = "0.13"
hidden-trait = "0.1"
log = { workspace = true }
mint = { workspace = true }
# `hlsl-out` feeds the D3D12 backend's WGSL -> HLSL -> DXIL path.
naga = { workspace = true, features = ["hlsl-out"] }
raw-window-handle = "0.6"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "CFCGTypes",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLTypes",
    "MTLPixelFormat",
    "MTLAllocation",
    "MTLResource",
    "MTLBuffer",
    "MTLTexture",
    "MTLSampler",
    "MTLDrawable",
    "MTLAccelerationStructure",
    "MTLAccelerationStructureTypes",
    "MTLCounters",
    "MTLLibrary",
    "MTLStageInputOutputDescriptor",
    "MTLComputePipeline",
    "MTLVertexDescriptor",
    "MTLDepthStencil",
    "MTLComputePipeline",
    "MTLRenderPipeline",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLAccelerationStructureCommandEncoder",
    "MTLBlitCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLRenderCommandEncoder",
    "MTLBlitPass",
    "MTLComputePass",
    "MTLRenderPass",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLCaptureManager",
    "MTLCaptureScope",
    "block2",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-metal",
    "objc2-core-foundation",
    "CALayer",
    "CAMetalLayer",
] }
naga = { workspace = true, features = ["msl-out"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-quartz-core",
    "objc2-core-foundation",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-quartz-core",
    "objc2-core-foundation",
    "UIResponder",
    "UIView",
    "UIWindow",
    "UIScene",
    "UIWindowScene",
    "UIScreen",
] }

[target.'cfg(any(vulkan, windows, target_os = "linux", target_os = "android", target_os = "freebsd", target_os = "redox"))'.dependencies]
ash = "0.38"
ash-window = "0.13"
gpu-alloc = "0.6"
gpu-alloc-ash = "0.7"
naga = { workspace = true, features = ["spv-out"] }
slab = { workspace = true }
openxr = { workspace = true }

[target.'cfg(any(gles, target_arch = "wasm32"))'.dependencies]
glow = "0.17"
naga = { workspace = true, features = ["glsl-out"] }

[target.'cfg(all(gles, not(target_arch = "wasm32")))'.dependencies]
egl = { package = "khronos-egl", version = "6.0", features = ["dynamic"] }
libc = "0.2"
libloading = { version = "0.9" }

[target.'cfg(all(target_arch = "wasm32"))'.dependencies]
wasm-bindgen = "0.2.83"
web-sys = { workspace = true, features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
] }
js-sys = "0.3.60"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "bitflags::*",
    "mint::*",
    "naga::*",
    "openxr::*",
    "raw_window_handle::*",
]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(gles)'] }
